[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/media",
    "crates/server",
    "crates/web",
]
default-members = [
    "crates/shared",
    "crates/media",
    "crates/server",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
console_error_panic_hook = "0.1.7"
ffmpeg-next = "8.1.0"
futures = "0.3.31"
gloo-net = "0.6.0"
hex = "0.4.3"
html-escape = "0.2.13"
http = "1.4.0"
http-body-util = "0.1.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
js-sys = "0.3.82"
leptos = "0.8.2"
lofty = "0.22.4"
metaflac = "0.2.5"
mime_guess = "2.0.5"
once_cell = "1.21.3"
o2o = "0.5.4"
opencc-jieba-rs = "0.7.2"
percent-encoding = "2.3.2"
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
symphonia-bundle-flac = "0.5.2"
symphonia-core = "0.5.2"
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.20.0", features = ["v4", "serde", "js"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = "0.3.82"
